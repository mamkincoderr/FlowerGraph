name: Build and Release FlowerGraph

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  extract-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract
        run: |
          VER=$(python -c "import re; m=re.search(r\"APP_VERSION = '(.+?)'\", open('ui/main_window.py').read()); print(m.group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [test, extract-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller FlowerGraph.spec --clean --noconfirm
      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output | Out-Null
          Compress-Archive -Path dist\FlowerGraph -DestinationPath "build_output\FlowerGraph_${{ needs.extract-version.outputs.version }}_windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FlowerGraph-Windows-${{ needs.extract-version.outputs.version }}
          path: build_output/FlowerGraph_${{ needs.extract-version.outputs.version }}_windows.zip
          retention-days: 14

  build-linux:
    needs: [test, extract-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 \
            libegl1 libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller FlowerGraph.spec --clean --noconfirm
      - name: Tar portable
        run: |
          mkdir -p build_output
          tar -czf "build_output/FlowerGraph_${{ needs.extract-version.outputs.version }}_linux.tar.gz" -C dist FlowerGraph
      - uses: actions/upload-artifact@v4
        with:
          name: FlowerGraph-Linux-${{ needs.extract-version.outputs.version }}
          path: build_output/FlowerGraph_${{ needs.extract-version.outputs.version }}_linux.tar.gz
          retention-days: 14

  github-release:
    needs: [extract-version, build-windows, build-linux]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlowerGraph-Windows-${{ needs.extract-version.outputs.version }}
          path: ./artifacts
      - uses: actions/download-artifact@v4
        with:
          name: FlowerGraph-Linux-${{ needs.extract-version.outputs.version }}
          path: ./artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: FlowerGraph v${{ needs.extract-version.outputs.version }}
          body: |
            Portable builds — распаковать и запустить.

            - `FlowerGraph_${{ needs.extract-version.outputs.version }}_windows.zip` — Windows 10/11 x64
            - `FlowerGraph_${{ needs.extract-version.outputs.version }}_linux.tar.gz` — Linux

            Windows: `FlowerGraph.exe`
            Linux: `./FlowerGraph`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
